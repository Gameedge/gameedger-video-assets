<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameEdger revised presentation</title>
<style>
body{margin:0;background:#101820;color:#fff;font-family:system-ui,sans-serif}
p{padding:14px 16px 8px;margin:0;font-size:16px}
button{display:block;width:calc(100% - 32px);margin:12px 16px;padding:18px;font-size:20px;font-weight:700;border:0;border-radius:10px;background:#1f6feb;color:#fff}
video{width:100%;background:#000;display:none}
a{color:#9ecbff;display:block;padding:8px 16px 20px}
</style>
</head>
<body>
<p>Revised presentation. It will not start until you tap the button.</p>
<button id="go" type="button">Tap here to start</button>
<video id="v" controls playsinline preload="none" src="https://cdn.jsdelivr.net/gh/Gameedge/gameedger-video-assets@cca65e2/GameEdger_Revised.mp4"></video>
<a href="https://cdn.jsdelivr.net/gh/Gameedge/gameedger-video-assets@cca65e2/GameEdger_Revised.mp4">Or download the video</a>
<script>
document.getElementById("go").onclick = function () {
  var v = document.getElementById("v");
  v.style.display = "block";
  this.style.display = "none";
  v.play();
};
</script>
</body>
</html>
